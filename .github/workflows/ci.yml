name: Python CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    name: Checks for ${{ matrix.directory }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory: [account, reports]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        id: dependencies
        run: python -m pip install flake8 pytest
      - name: Lint with Flake8
        run: python -m flake8 --filename='*.py,*.PY' ${{ matrix.directory }}
      - name: Run tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: python -m pytest ${{ matrix.directory }}

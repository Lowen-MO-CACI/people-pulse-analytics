name: Python CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  lint:
    name: Flake8 linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Flake8
        run: python -m pip install flake8
      - name: Lint with Flake8
        run: python -m flake8 --filename='*.py,*.PY' account reports

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run tests
        run: python -m pytest account reports
